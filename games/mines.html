<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#EFEBE0">
<meta name="xeena-worker" content="https://api.xeena.my.id">
<title>Minesweeper — Xeena Games</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .stage{padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .modes{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  .mode{padding:7px 12px;border-radius:0;background:var(--panel);border:1px solid var(--line);
    font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
  .mode:hover{border-color:#3d4a56}
  .mode.sel{border-color:var(--gold);color:var(--gold);background:#1a1b13}
  .info{display:flex;gap:18px;font-size:14px;color:var(--dim);font-weight:600;align-items:center}
  .info b{color:var(--gold);font-size:16px;font-variant-numeric:tabular-nums}
  .info .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .info .face{font-family:var(--mono);font-weight:700;color:var(--gold)}
  .grid{display:grid;gap:2px;background:#2b343e;padding:3px;border-radius:0}
  .cell{
    width:30px;height:30px;background:#3a4350;border-radius:0;display:grid;place-items:center;
    font-weight:800;font-size:15px;cursor:pointer;user-select:none;font-family:var(--mono);transition:background .1s
  }
  .cell:hover{background:#4a5560}
  .cell.opened{background:#1a2026;cursor:default}
  .cell.opened:hover{background:#1a2026}
  .cell.flag{color:#e05252}
  .c1{color:#3fbf6b}.c2{color:#1d6ee0}.c3{color:#e05252}.c4{color:#7d3bbf}
  .c5{color:#8e2323}.c6{color:#1d9e4b}.c7{color:#5a6670}.c8{color:#e8e6e1}
  .mine{background:#e05252 !important;color:#141310}
  .btn{padding:10px 18px;border-radius:0;background:#C8FF2E;color:#141310;font-size:12.5px;font-weight:800;cursor:pointer;border:none}
  .btn:active{transform:scale(.97)}
  .btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .sm{width:24px;height:24px;font-size:12px}
  .md{width:30px;height:30px;font-size:14px}
  .lg{width:34px;height:34px;font-size:15px}
  .result{font-size:18px;font-weight:800;color:var(--gold);min-height:24px}
  .result.bad{color:var(--bad)}
  @media(max-width:560px){ .lg{width:28px;height:28px;font-size:13px} }
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="../index.html" style="cursor:pointer">
    <div class="logo">X</div><div><div class="name"><b>Xeena</b> Games</div><div class="sub">Minesweeper</div></div>
  </a>
  <a class="backlink" href="../index.html">[← INDEX]</a><div class="spacer"></div>
  <div class="userchip"></div>
</div>

<main class="stage">
  <div class="modes">
    <button class="mode sel" data-diff="0">Pemula (9×9, 10)</button>
    <button class="mode" data-diff="1">Menengah (16×16, 40)</button>
    <button class="mode" data-diff="2">Ahli (16×30, 99)</button>
  </div>
  <div class="info">
    <div><span class="lbl">Ranjau</span> <b id="flags">0</b>/<b id="totalMines">10</b></div>
    <div><span class="lbl">Waktu</span> <b id="time">0</b>s</div>
    <div><span class="lbl">Status</span> <span class="face" id="face">:-)</span></div>
  </div>
  <div class="result" id="result">&nbsp;</div>
  <div class="grid" id="grid"></div>
  <div style="display:flex;gap:9px">
    <button class="btn" id="btnNew">Mulai Baru</button>
  </div>
  <div style="font-size:11px;color:var(--dim);text-align:center;letter-spacing:.4px;max-width:500px;line-height:1.5">
    Klik kiri untuk buka kotak. Klik kanan (atau tap-tahan di mobile) untuk pasang bendera. Buka semua kotak aman untuk menang.
  </div>
</main>

<script src="../assets/app.js"></script>
<script>
'use strict';
const DIFFS=[
  {w:9,h:9,m:10,cls:'sm'},
  {w:16,h:16,m:40,cls:'md'},
  {w:30,h:16,m:99,cls:'lg'}
];
let diff=0, grid, opened, flagged, gameOver, win, started, timerId, timeStart, minesPlaced=false;
const MINE_CH='✸', FLAG_CH='⚑';

const gridEl=document.getElementById('grid');
const flagsEl=document.getElementById('flags');
const totalMinesEl=document.getElementById('totalMines');
const timeEl=document.getElementById('time');
const faceEl=document.getElementById('face');
const resultEl=document.getElementById('result');

function newGame(){
  if(timerId) clearInterval(timerId);
  const d=DIFFS[diff];
  grid=Array(d.h).fill().map(()=>Array(d.w).fill(0));
  opened=Array(d.h).fill().map(()=>Array(d.w).fill(false));
  flagged=Array(d.h).fill().map(()=>Array(d.w).fill(false));
  gameOver=false; win=false; started=false; timeStart=0; minesPlaced=false;
  // Ranjau ditaruh SETELAH klik pertama — klik pertama (plus tetangganya) dijamin aman
  flagsEl.textContent=0;
  totalMinesEl.textContent=d.m;
  timeEl.textContent=0;
  faceEl.textContent=':-)';
  resultEl.innerHTML='&nbsp;';
  resultEl.classList.remove('bad');
  render();
}

function placeMines(sx,sy){
  const d=DIFFS[diff];
  // zona aman: sel klik pertama + 8 tetangganya
  const safe=new Set();
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const nx=sx+dx, ny=sy+dy;
    if(nx>=0&&nx<d.w&&ny>=0&&ny<d.h) safe.add(ny*d.w+nx);
  }
  let placed=0;
  while(placed<d.m){
    const x=Math.floor(Math.random()*d.w), y=Math.floor(Math.random()*d.h);
    if(grid[y][x]!==-1 && !safe.has(y*d.w+x)){ grid[y][x]=-1; placed++; }
  }
  // hitung neighbors
  for(let y=0;y<d.h;y++)for(let x=0;x<d.w;x++){
    if(grid[y][x]===-1) continue;
    let n=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(dx===0&&dy===0) continue;
      const nx=x+dx, ny=y+dy;
      if(nx>=0&&nx<d.w&&ny>=0&&ny<d.h && grid[ny][nx]===-1) n++;
    }
    grid[y][x]=n;
  }
  minesPlaced=true;
}

function render(){
  const d=DIFFS[diff];
  gridEl.style.gridTemplateColumns=`repeat(${d.w}, 1fr)`;
  gridEl.innerHTML='';
  for(let y=0;y<d.h;y++)for(let x=0;x<d.w;x++){
    const c=document.createElement('div');
    c.className='cell '+d.cls;
    if(opened[y][x]){
      c.classList.add('opened');
      if(grid[y][x]===-1){
        c.classList.add('mine');
        c.textContent=MINE_CH;
      }else if(grid[y][x]>0){
        c.classList.add('c'+grid[y][x]);
        c.textContent=grid[y][x];
      }
    }else if(flagged[y][x]){
      c.classList.add('flag');
      c.textContent=FLAG_CH;
    }
    c.dataset.x=x; c.dataset.y=y;
    c.onclick=()=>reveal(x,y);
    c.oncontextmenu=(e)=>{ e.preventDefault(); toggleFlag(x,y); };
    // long-press untuk flag di mobile.
    // Tekan ≥350ms → toggle flag dan CEGAH click yang menyusul (bug lama: flag+reveal sekaligus).
    let pressTimer=null;
    c.addEventListener('touchstart', ()=>{
      pressTimer=setTimeout(()=>{ pressTimer='fired'; toggleFlag(x,y); }, 350);
    },{passive:true});
    c.addEventListener('touchend', e=>{
      if(pressTimer && pressTimer!=='fired'){ clearTimeout(pressTimer); }
      if(pressTimer==='fired'){ e.preventDefault(); pressTimer=null; } // matikan click sintetis
    });
    c.addEventListener('touchmove', ()=>{ if(pressTimer && pressTimer!=='fired'){ clearTimeout(pressTimer); pressTimer=null; } },{passive:true});
    gridEl.appendChild(c);
  }
}

function startTimer(){
  started=true; timeStart=Date.now();
  timerId=setInterval(()=>{
    timeEl.textContent=Math.floor((Date.now()-timeStart)/1000);
  }, 500);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

function reveal(x,y){
  if(gameOver||win) return;
  if(flagged[y][x]||opened[y][x]) return;
  if(!started){ startTimer(); }
  const d=DIFFS[diff];
  // klik pertama → taruh ranjau sekarang, zona klik dijamin aman
  if(!minesPlaced) placeMines(x,y);
  if(grid[y][x]===-1){
    // kena mine
    opened[y][x]=true;
    revealAllMines();
    gameOver=true; stopTimer();
    faceEl.textContent='X-(';
    resultEl.textContent='Boom! Kamu kena ranjau.';
    resultEl.classList.add('bad');
    render();
    submitScore(false);
    return;
  }
  // flood fill kalau 0
  const stack=[[x,y]];
  while(stack.length){
    const [cx,cy]=stack.pop();
    if(cx<0||cx>=d.w||cy<0||cy>=d.h) continue;
    if(opened[cy][cx]||flagged[cy][cx]) continue;
    opened[cy][cx]=true;
    if(grid[cy][cx]===0){
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        if(dx===0&&dy===0) continue;
        stack.push([cx+dx,cy+dy]);
      }
    }
  }
  render();
  checkWin();
}

function revealAllMines(){
  const d=DIFFS[diff];
  for(let y=0;y<d.h;y++)for(let x=0;x<d.w;x++){
    if(grid[y][x]===-1) opened[y][x]=true;
  }
}

function toggleFlag(x,y){
  if(gameOver||win) return;
  if(opened[y][x]) return;
  flagged[y][x]=!flagged[y][x];
  let count=0;
  for(let yy=0;yy<DIFFS[diff].h;yy++)for(let xx=0;xx<DIFFS[diff].w;xx++) if(flagged[yy][xx]) count++;
  flagsEl.textContent=count;
  render();
  checkWin();
}

function checkWin(){
  if(gameOver) return;
  const d=DIFFS[diff];
  let unopened=0;
  for(let y=0;y<d.h;y++)for(let x=0;x<d.w;x++) if(!opened[y][x]) unopened++;
  if(unopened===d.m){
    win=true; stopTimer();
    faceEl.textContent='8-)';
    const t=Math.floor((Date.now()-timeStart)/1000);
    resultEl.innerHTML=`Menang! Waktu <b>${t}s</b>`;
    submitScore(true, t);
  }
}

function submitScore(won, time){
  if(!XEENA.isLoggedIn()) return;
  const d=DIFFS[diff];
  const score = won ? (d.m*1000 - time*5 + (diff===2?3000:diff===1?1500:0)) : 0;
  XEENA.submitScore('mines', Math.max(0,score), {diff, won, time, mines:d.m}).catch(()=>{});
}

document.querySelectorAll('.mode').forEach(m=>m.addEventListener('click',()=>{
  document.querySelectorAll('.mode').forEach(x=>x.classList.remove('sel'));
  m.classList.add('sel'); diff=+m.dataset.diff; newGame();
}));
document.getElementById('btnNew').addEventListener('click', newGame);
newGame();
XEENA.renderUserChip();
</script>
</body>
</html>
