<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#EFEBE0">
<meta name="xeena-worker" content="">
<title>Snake — Xeena Games</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .stage{padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .modes{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  .mode{padding:7px 12px;border-radius:0;background:var(--panel);border:1px solid var(--line);
    font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
  .mode:hover{border-color:#3d4a56}
  .mode.sel{border-color:var(--gold);color:var(--gold);background:#1a1b13}
  .info{display:flex;gap:18px;font-size:13px;color:var(--dim);font-weight:600}
  .info b{color:var(--gold);font-size:15px;font-variant-numeric:tabular-nums}
  canvas{background:#0a0e11;border:1px solid var(--line);border-radius:0;display:block;touch-action:none}
  .ctrls{display:flex;gap:7px;justify-content:center;margin-top:6px}
  .dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:5px}
  .dpad .b{background:var(--panel);border:1px solid var(--line);border-radius:0;
    display:grid;place-items:center;font-size:22px;color:var(--dim);cursor:pointer;user-select:none}
  .dpad .b:active{background:var(--gold);color:#141310;transform:scale(.95)}
  .dpad .up{grid-column:2;grid-row:1}
  .dpad .left{grid-column:1;grid-row:2}
  .dpad .right{grid-column:3;grid-row:2}
  .dpad .down{grid-column:2;grid-row:3}
  .btn{padding:10px 18px;border-radius:0;background:#C8FF2E;
    color:#141310;font-size:12.5px;font-weight:800;cursor:pointer;border:none}
  .btn:active{transform:scale(.97)}
  .overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:200}
  .ovbox{width:min(360px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:0;padding:24px;text-align:center}
  .ovbox h2{font-size:22px;font-weight:800;margin-bottom:10px}
  .ovbox p{color:var(--dim);font-size:13px;margin-bottom:18px}
  @media(min-width:560px){ .dpad{display:none} }
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="../index.html" style="cursor:pointer">
    <div class="logo">X</div><div><div class="name"><b>Xeena</b> Games</div><div class="sub">Snake</div></div>
  </a>
  <a class="backlink" href="../index.html">[← INDEX]</a><div class="spacer"></div>
  <div class="userchip"></div>
</div>

<main class="stage">
  <div class="modes">
    <button class="mode sel" data-walls="0">Tanpa Dinding</button>
    <button class="mode" data-walls="1">Dinding</button>
    <button class="mode" data-speed="slow">Lambat</button>
    <button class="mode sel" data-speed="normal">Normal</button>
    <button class="mode" data-speed="fast">Cepat</button>
  </div>
  <div class="info">
    <div>Skor: <b id="score">0</b></div>
    <div>Best: <b id="best">0</b></div>
    <div>Panjang: <b id="len">3</b></div>
  </div>
  <canvas id="c" width="400" height="400"></canvas>
  <div class="dpad">
    <div class="b up" data-d="up">▲</div>
    <div class="b left" data-d="left">◀</div>
    <div class="b right" data-d="right">▶</div>
    <div class="b down" data-d="down">▼</div>
  </div>
  <button class="btn" id="btnStart">Mulai</button>
</main>

<div class="overlay" id="overlay"><div class="ovbox">
  <h2 id="ovTitle">Game Over</h2>
  <p id="ovSub">Skor: 0</p>
  <button class="btn" id="btnRetry">Coba Lagi</button>
</div></div>

<script src="../assets/app.js"></script>
<script>
'use strict';
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best'),
      lenEl=document.getElementById('len');

let GRID=20, CELL=20, snake=[], dir, nextDir, food, score, walls=0, speed=100, speedMode='normal', loopId=null, alive=true;
const SPEEDS={slow:140, normal:100, fast:70};

function resize(){
  // sesuaikan ukuran cell dengan viewport
  const vw=Math.min(window.innerWidth-32, 480);
  CELL=Math.floor(vw/GRID);
  cv.width=cv.height=CELL*GRID;
}

function reset(){
  snake=[{x:Math.floor(GRID/2),y:Math.floor(GRID/2)},{x:Math.floor(GRID/2)-1,y:Math.floor(GRID/2)},{x:Math.floor(GRID/2)-2,y:Math.floor(GRID/2)}];
  dir={x:1,y:0}; nextDir={x:1,y:0}; score=0; alive=true;
  scoreEl.textContent=0; lenEl.textContent=snake.length;
  spawnFood();
}

function spawnFood(){
  while(true){
    food={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)};
    if(!snake.some(s=>s.x===food.x&&s.y===food.y)) break;
  }
}

function step(){
  if(!alive) return;
  dir=nextDir;
  const head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if(walls){
    if(head.x<0||head.x>=GRID||head.y<0||head.y>=GRID){ die(); return; }
  }else{
    head.x=(head.x+GRID)%GRID; head.y=(head.y+GRID)%GRID;
  }
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){ die(); return; }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10; scoreEl.textContent=score; lenEl.textContent=snake.length;
    spawnFood();
    // speedup
    if(speed>SPEEDS[speedMode] && score%50===0) { speed-=5; restartLoop(); }
  }else{
    snake.pop();
  }
  draw();
}

function draw(){
  ctx.fillStyle='#0a0e11';
  ctx.fillRect(0,0,cv.width,cv.height);
  // grid lines subtle
  ctx.strokeStyle='#141a1f';
  ctx.lineWidth=1;
  for(let i=1;i<GRID;i++){ ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,cv.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(cv.width,i*CELL);ctx.stroke(); }
  // food
  ctx.fillStyle='#e05252';
  ctx.beginPath();
  ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL*0.32, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#C8FF2E';
  ctx.beginPath();ctx.arc(food.x*CELL+CELL*0.65, food.y*CELL+CELL*0.35, CELL*0.1, 0, Math.PI*2);ctx.fill();
  // snake
  for(let i=snake.length-1;i>=0;i--){
    const s=snake[i];
    if(i===0){
      ctx.fillStyle='#43b46a';
    }else{
      const t=i/snake.length;
      ctx.fillStyle=`rgb(${Math.round(29+(67-29)*t)},${Math.round(107+(180-107)*t)},${Math.round(54+(106-54)*t)})`;
    }
    const r=3;
    ctx.beginPath();
    roundRect(ctx, s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2, r);
    ctx.fill();
    // eyes on head
    if(i===0){
      ctx.fillStyle='#fff';
      const ex=dir.x*CELL*0.2, ey=dir.y*CELL*0.2;
      ctx.beginPath();ctx.arc(s.x*CELL+CELL/2+ex-dir.y*CELL*0.2, s.y*CELL+CELL/2+ey+dir.x*CELL*0.2, 2, 0, Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(s.x*CELL+CELL/2+ex+dir.y*CELL*0.2, s.y*CELL+CELL/2+ey-dir.x*CELL*0.2, 2, 0, Math.PI*2);ctx.fill();
    }
  }
}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}

function die(){
  alive=false; clearInterval(loopId); loopId=null;
  const best=+localStorage.getItem('xeena.snake.best')||0;
  if(score>best){ localStorage.setItem('xeena.snake.best', score); bestEl.textContent=score; }
  document.getElementById('ovTitle').textContent='Game Over';
  document.getElementById('ovSub').textContent='Skor: '+score+' · Best: '+Math.max(best,score);
  document.getElementById('overlay').style.display='flex';
  if(XEENA.isLoggedIn()){
    XEENA.submitScore('snake', score, {walls, speedMode: speedLabel()}).catch(()=>{});
  }
}

function speedLabel(){ return speedMode; }

function restartLoop(){
  if(loopId) clearInterval(loopId);
  loopId=setInterval(step, speed);
}

function start(){
  document.getElementById('overlay').style.display='none';
  reset(); draw(); restartLoop();
}

function setDir(d){
  if(d==='up'&&dir.y!==1) nextDir={x:0,y:-1};
  else if(d==='down'&&dir.y!==-1) nextDir={x:0,y:1};
  else if(d==='left'&&dir.x!==1) nextDir={x:-1,y:0};
  else if(d==='right'&&dir.x!==-1) nextDir={x:1,y:0};
}

document.addEventListener('keydown', e=>{
  if(['ArrowUp','w','W'].includes(e.key)){ setDir('up'); e.preventDefault(); }
  else if(['ArrowDown','s','S'].includes(e.key)){ setDir('down'); e.preventDefault(); }
  else if(['ArrowLeft','a','A'].includes(e.key)){ setDir('left'); e.preventDefault(); }
  else if(['ArrowRight','d','D'].includes(e.key)){ setDir('right'); e.preventDefault(); }
  else if(e.key===' '){ if(!alive) start(); e.preventDefault(); }
});
document.querySelectorAll('.dpad .b').forEach(b=>b.addEventListener('click',()=>setDir(b.dataset.d)));
// swipe
let tx=0, ty=0;
cv.addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; });
cv.addEventListener('touchend', e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)){ setDir(dx>0?'right':'left'); }
  else { setDir(dy>0?'down':'up'); }
});

document.querySelectorAll('.mode[data-walls]').forEach(m=>m.addEventListener('click',()=>{
  document.querySelectorAll('.mode[data-walls]').forEach(x=>x.classList.remove('sel'));
  m.classList.add('sel'); walls=+m.dataset.walls;
  if(!alive) start();
}));
document.querySelectorAll('.mode[data-speed]').forEach(m=>m.addEventListener('click',()=>{
  document.querySelectorAll('.mode[data-speed]').forEach(x=>x.classList.remove('sel'));
  m.classList.add('sel');
  speedMode=m.dataset.speed;
  speed=SPEEDS[speedMode];
  if(loopId) restartLoop();
}));
document.getElementById('btnStart').addEventListener('click', start);
document.getElementById('btnRetry').addEventListener('click', start);

bestEl.textContent=localStorage.getItem('xeena.snake.best')||0;
window.addEventListener('resize', ()=>{ resize(); if(!loopId) draw(); });
resize();
reset(); draw();
XEENA.renderUserChip();
</script>
</body>
</html>
