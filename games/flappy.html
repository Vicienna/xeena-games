<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101418">
<meta name="xeena-worker" content="">
<title>Flappy — Xeena Games</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .stage{padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:calc(100vh - 56px)}
  .info{display:flex;gap:18px;font-size:14px;color:var(--dim);font-weight:600}
  .info b{color:var(--gold);font-size:18px;font-variant-numeric:tabular-nums}
  .info .lbl{display:block;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);text-align:center;margin-bottom:2px}
  .info .v{font-size:20px;font-weight:800;color:var(--txt)}
  .gamearea{position:relative;width:min(420px,94vw);aspect-ratio:9/16;background:#0a0e11;border:1px solid var(--line);border-radius:0;overflow:hidden;touch-action:none}
  canvas{width:100%;height:100%;display:block}
  .score-overlay{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:48px;font-weight:800;color:#fff;text-shadow:0 0 12px #000a,0 4px 8px #0006;pointer-events:none;font-family:var(--mono)}
  .start-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000a;color:#fff;gap:12px;text-align:center;padding:20px}
  .start-overlay h2{font-size:26px;font-weight:800;letter-spacing:-.4px}
  .start-overlay p{font-size:13px;color:var(--dim);max-width:280px;line-height:1.5}
  .start-overlay .tap{font-size:14px;color:var(--gold);font-weight:700;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
  .btn{padding:11px 22px;border-radius:0;background:#C8FF2E;color:#141310;font-size:13px;font-weight:800;cursor:pointer;border:none;box-shadow:3px 3px 0 #000}
  .btn:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="../index.html" style="cursor:pointer">
    <div class="logo">X</div><div><div class="name"><b>Xeena</b> Games</div><div class="sub">Flappy</div></div>
  </a>
  <a class="backlink" href="../index.html">[← INDEX]</a><div class="spacer"></div>
  <div class="userchip"></div>
</div>

<main class="stage">
  <div class="info">
    <div><div class="lbl">Skor</div><div class="v" id="score">0</div></div>
    <div><div class="lbl">Best</div><div class="v" id="best">0</div></div>
  </div>
  <div class="gamearea" id="ga">
    <canvas id="c"></canvas>
    <div class="score-overlay" id="so">0</div>
    <div class="start-overlay" id="start">
      <h2>Flappy Xeena</h2>
      <p>Tap / klik / tekan spasi untuk terbang. Hindari pipa. Tahan untuk wing-flap terus.</p>
      <button class="btn" id="btnStart">Mulai</button>
    </div>
  </div>
  <div style="font-size:11px;color:var(--dim);letter-spacing:.4px">Tap dimana saja untuk flap</div>
</main>

<script src="../assets/app.js"></script>
<script>
'use strict';
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const so=document.getElementById('so');
const startEl=document.getElementById('start');

let W=0,H=0, bird, pipes, score, best, alive, gap=130, pipeW=58, frame=0, lastPipe=0, gravity=0.42, flapV=-7.2;

function resize(){
  const r=cv.parentElement.getBoundingClientRect();
  const dpr=Math.min(devicePixelRatio||1, 2);
  cv.width=W=Math.round(r.width*dpr);
  cv.height=H=Math.round(r.height*dpr);
  cv.style.width=r.width+'px'; cv.style.height=r.height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  W=r.width; H=r.height;
}

function reset(){
  bird={x:W*0.25, y:H/2, vy:0, r:14};
  pipes=[]; score=0; alive=true; frame=0; lastPipe=0;
  so.textContent='0';
  document.getElementById('score').textContent=0;
  startEl.style.display='none';
}

function spawnPipe(){
  const margin=60;
  const top=margin + Math.random()*(H-gap-2*margin);
  pipes.push({x:W+10, top, gap, passed:false});
}

function step(){
  if(!alive) return;
  frame++;
  bird.vy += gravity;
  bird.y += bird.vy;
  // spawn pipe
  if(frame-lastPipe >= 90){
    spawnPipe();
    lastPipe=frame;
  }
  // move pipes
  for(const p of pipes){
    p.x -= 2.5;
    if(!p.passed && p.x+pipeW<bird.x){
      p.passed=true; score++; so.textContent=score;
      document.getElementById('score').textContent=score;
    }
    // collision
    if(bird.x+bird.r>p.x && bird.x-bird.r<p.x+pipeW){
      if(bird.y-bird.r < p.top || bird.y+bird.r > p.top+p.gap){
        die();
      }
    }
  }
  pipes = pipes.filter(p=>p.x>-pipeW-10);
  // floor / ceiling
  if(bird.y+bird.r > H || bird.y-bird.r < 0) die();
  draw();
}

function die(){
  alive=false;
  best=Math.max(best,score);
  localStorage.setItem('xeena.flappy.best', best);
  document.getElementById('best').textContent=best;
  if(XEENA.isLoggedIn()){
    XEENA.submitScore('flappy', score, {}).catch(()=>{});
  }
  // tampilkan game over
  setTimeout(()=>{
    startEl.style.display='flex';
    startEl.querySelector('h2').textContent='Game Over';
    startEl.querySelector('p').textContent=`Skor: ${score} · Best: ${best}`;
    startEl.querySelector('.tap')?.remove();
    if(!startEl.querySelector('.tap')){
      const t=document.createElement('div');
      t.className='tap'; t.textContent='Tap untuk coba lagi';
      startEl.appendChild(t);
    }
  }, 200);
}

function draw(){
  // background gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a2630'); g.addColorStop(1,'#0a0e11');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // distant buildings (parallax)
  ctx.fillStyle='#141a20';
  for(let i=0;i<5;i++){
    const x=(i*60 - frame*0.3) % (W+60);
    const h=80+(i*23)%60;
    ctx.fillRect(x, H-h, 50, h);
  }
  // pipes
  for(const p of pipes){
    // top pipe
    const grad=ctx.createLinearGradient(p.x,0,p.x+pipeW,0);
    grad.addColorStop(0,'#1d6b36'); grad.addColorStop(.5,'#43b46a'); grad.addColorStop(1,'#1d6b36');
    ctx.fillStyle=grad;
    ctx.fillRect(p.x, 0, pipeW, p.top);
    ctx.fillRect(p.x-3, p.top-18, pipeW+6, 18);
    ctx.fillRect(p.x, p.top+p.gap, pipeW, H-p.top-p.gap);
    ctx.fillRect(p.x-3, p.top+p.gap, pipeW+6, 18);
    // highlight
    ctx.fillStyle='rgba(255,255,255,.12)';
    ctx.fillRect(p.x+5, 0, 4, p.top);
    ctx.fillRect(p.x+5, p.top+p.gap, 4, H-p.top-p.gap);
  }
  // bird
  ctx.save();
  ctx.translate(bird.x, bird.y);
  const rot=Math.max(-.4, Math.min(.8, bird.vy*0.05));
  ctx.rotate(rot);
  // body
  const bg=ctx.createRadialGradient(-4,-4,2,0,0,bird.r);
  bg.addColorStop(0,'#f5d77a'); bg.addColorStop(1,'#d49a30');
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.arc(0,0,bird.r,0,Math.PI*2); ctx.fill();
  // wing
  ctx.fillStyle='#c9821f';
  ctx.beginPath(); ctx.ellipse(-3, 3, 8, 5, 0, 0, Math.PI*2); ctx.fill();
  // eye
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(6, -4, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.arc(7, -4, 2, 0, Math.PI*2); ctx.fill();
  // beak
  ctx.fillStyle='#f07d18';
  ctx.beginPath(); ctx.moveTo(bird.r-2, -2); ctx.lineTo(bird.r+6, 0); ctx.lineTo(bird.r-2, 3); ctx.closePath(); ctx.fill();
  ctx.restore();
  // ground
  ctx.fillStyle='#39424d';
  ctx.fillRect(0, H-12, W, 12);
}

function flap(){
  if(!alive){ startGame(); return; }
  bird.vy = flapV;
}

let raf=null;
function loop(){
  if(alive) step();
  else draw();
  raf=requestAnimationFrame(loop);
}

function startGame(){
  reset();
  if(!raf) loop();
}

cv.addEventListener('pointerdown', e=>{ e.preventDefault(); flap(); });
document.addEventListener('keydown', e=>{
  if(e.code==='Space'||e.key===' '){ e.preventDefault(); flap(); }
});
document.getElementById('btnStart').addEventListener('click', startGame);
startEl.addEventListener('click', e=>{ if(e.target.id!=='btnStart' && !alive) startGame(); });
window.addEventListener('resize', ()=>{ resize(); if(!alive) draw(); });

best=+localStorage.getItem('xeena.flappy.best')||0;
document.getElementById('best').textContent=best;
resize();
/* init state minimal supaya draw() awal tidak crash (start overlay masih tampil) */
bird={x:W*0.25,y:H/2,vy:0,r:14}; pipes=[]; score=0; alive=false; frame=0; lastPipe=0;
draw();
XEENA.renderUserChip();
</script>
</body>
</html>
